spring.application.name=Aahar
spring.datasource.url=${DATA_SOURCE_URL}
spring.datasource.username=${DATA_SOURCE_USERNAME}
spring.datasource.password=${DATA_SOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.ai.retry.max-attempts=1
spring.ai.openai.api-key=${API_FREE_KEY}
spring.ai.openai.base-url=${AI_BASE_URL}
spring.ai.openai.chat.completions-path=${AI_COMPLETIONS_PATH}

spring.ai.openai.chat.options.model=${AI_CHATMODEL}
spring.ai.openai.chat.options.temperature=0.7
google.client-id=${GOOGLE_CLIENT_ID}
spring.ai.openai.default-headers.HTTP-Referer=http://localhost:8080
spring.ai.openai.default-headers.X-Title=Aahar

